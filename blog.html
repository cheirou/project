<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheirou - Blog</title>
    <style>
        /* Y2K Retro Color Palette Variables */
        :root {
            --header-image: url('https://neocities.org');
            --body-bg-image: url('https://neocities.org');
            --content-bg: #43256E;
            --panel-bg: #13092D;
            --text-color: #fceaff;
            --link-color: #ED64F5;
        }

        @font-face {
            font-family: Nunito;
            src: url('https://neocities.org');
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            background-color: #08031A;
            background-size: 65px;
            color: var(--text-color);
            background-image: var(--body-bg-image);
        }

        * {
            box-sizing: border-box;
        }

        #container {
            max-width: 900px;
            margin: 20px auto;
            background-color: rgba(67, 37, 110, 0.85); /* Semi-transparent content area */
            padding: 15px;
            border: 3px double var(--link-color); /* Retro double border */
        }

        #container a {
            color: var(--link-color);
            font-weight: bold;
        }

        #header {
            width: 100%;
            background-color: #5e4e8c;
            height: 150px;
            background-image: var(--header-image);
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid var(--link-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #header h1 {
            color: #fff;
            text-shadow: 2px 2px #000, -2px -2px #000, 2px -2px #000, -2px 2px #000;
            font-size: 3rem;
            letter-spacing: 3px;
        }

        #navbar {
            background-color: var(--panel-bg);
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--link-color);
        }

        #navbar ul {
            display: flex;
            padding: 0;
            margin: 0;
            list-style-type: none;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        #navbar li {
            padding: 10px 0;
        }

        #navbar li a {
            color: var(--link-color);
            font-weight: 800;
            text-decoration: none;
        }

        #navbar li a:hover {
            text-decoration: underline;
            color: #fff;
        }

        #flex {
            display: flex;
            flex-direction: row-reverse; /* Keeps sidebar on the left, main content on right */
            gap: 15px;
        }

        main {
            flex: 3;
            background-color: rgba(19, 9, 45, 0.6);
            padding: 20px;
            border: 1px dashed var(--link-color);
        }

        aside {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 15px;
            border: 1px solid var(--link-color);
        }

        .box {
            border: 1px solid var(--text-color);
            padding: 10px;
            margin-top: 10px;
            background: rgba(0,0,0,0.3);
        }

        /* --- Collapsible Dropdown / Accordion Styling --- */
        details {
            background-color: var(--panel-bg);
            border: 1px solid var(--link-color);
            margin-bottom: 12px;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        details[open] {
            background-color: rgba(19, 9, 45, 0.9);
            border-color: #fff;
        }

        summary {
            padding: 12px 15px;
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--link-color);
            cursor: pointer;
            list-style: none; /* Removes default browser marker */
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.2);
        }

        summary:hover {
            background-color: rgba(237, 100, 245, 0.15);
            color: #fff;
        }

        /* Custom Dropdown Arrow */
        summary::after {
            content: "►";
            font-size: 0.8rem;
            transition: transform 0.2s ease;
            color: var(--link-color);
        }

        details[open] summary::after {
            transform: rotate(90deg);
            color: #fff;
        }

        .blog-content {
            padding: 15px;
            line-height: 1.6;
            color: var(--text-color);
            border-top: 1px dashed rgba(237, 100, 245, 0.4);
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.95rem;
        }

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.8rem;
            border-top: 1px solid var(--link-color);
            padding-top: 10px;
        }

        /* Responsive design for mobile screens */
        @media (max-width: 768px) {
            #flex {
                flex-direction: column;
            }
        }
    </style>
</head>
