<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheirou - Official Website</title>

        <!-- Custom Tab Icon -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        /* Bandcamp Button Styling */
        .bandcamp-btn {
            display: inline-block;
            background-color: #1ea0c4; /* Bandcamp brand blue */
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 30px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(30, 160, 196, 0.3);
        }

        .bandcamp-btn:hover {
            background-color: #1986a4;
            transform: translateY(-2px);
        }

        .bandcamp-btn:active {
            transform: translateY(0);
        }

        /* Text Link Styling */
        .text-link-container {
            margin-top: 25px;
        }

        .text-link {
            color: #1ea0c4;
            text-decoration: none;
            border-bottom: 1px dashed #1ea0c4;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .text-link:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* Back Home Button Styling */
        .home-btn {
            display: inline-block;
            margin-top: 40px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px 20px;
            border: 1px solid #333333;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            color: #ffffff;
            border-color: #1ea0c4;
            background-color: rgba(30, 160, 196, 0.1);
        }
    </style>
</head>
<body>

    <h1>Cheirou</h1>
    <p>Listen to music, grab merch, and support directly on Bandcamp.</p>

    <!-- Option 1a: The Button Link -->
    <a href="https://cheirou.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="bandcamp-btn">
        Listen on Bandcamp
    </a>

    <!-- Option 1b: Alternative Text Link -->
    <div class="text-link-container">
        <span>or visit the </span>
        <a href="https://cheirou.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="text-link">
            Cheirou Bandcamp Profile
        </a>
    </div>

    <!-- Return to Home Button -->
    <div>
        <a href="project/index.html" class="home-btn">&larr; Return to Home</a>
    </div>

</body>
</html>
